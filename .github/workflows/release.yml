name: Release OneLog

on:
  push:
    tags:
      - "v*"
    branches:
      - master

# Cancel in-progress builds on the same ref if a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libarchive-tools zstd jq gh

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and Publish Tauri Application
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: OneLog v__VERSION__
          releaseBody: See the assets below to download and install OneLog.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.matrix.args }}

      - name: Generate Arch Linux Package Archive
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          APPIMAGE="src-tauri/target/release/bundle/appimage/OneLog_${VERSION}_amd64.AppImage"

          if [ -f "$APPIMAGE" ]; then
            SHA256=$(sha256sum "$APPIMAGE" | awk '{print $1}')

            mkdir -p arch-package
            cp .arch/PKGBUILD arch-package/PKGBUILD
            cp .arch/.SRCINFO arch-package/.SRCINFO
            cp .arch/.gitignore arch-package/.gitignore

            sed -i "s|__VERSION__|${VERSION}|g" arch-package/PKGBUILD arch-package/.SRCINFO
            sed -i "s|__SHA256__|${SHA256}|g" arch-package/PKGBUILD arch-package/.SRCINFO
            sed -i "s|__REPOSITORY__|${{ github.repository }}|g" arch-package/PKGBUILD arch-package/.SRCINFO

            tar -czvf onelog-arch.tar.gz -C arch-package PKGBUILD .SRCINFO .gitignore
            gh release upload "v${VERSION}" onelog-arch.tar.gz --clobber
          fi
